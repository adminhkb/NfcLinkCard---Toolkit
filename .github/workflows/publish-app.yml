name: Publish APP

on:
  # Publishing requires NLC_PUBLISH_ENABLED=true and NLC-specific signing secrets.
  workflow_dispatch:

concurrency:
  group: publish-app
  cancel-in-progress: true

jobs:
  build-android:
    if: ${{ vars.NLC_PUBLISH_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nlc_toolkit
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: actions/setup-java@v6
        with:
          distribution: "zulu"
          java-version: "21"
      - name: Load Secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_KEY_PROPERTIES }}
          filename: "key.properties"
          working-directory: "./nlc_toolkit/android"
      - name: Load Secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_UPLOAD_KEYSTORE }}
          filename: "upload-keystore.jks"
          working-directory: "./nlc_toolkit"
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - run: flutter pub get
      - run: flutter build appbundle --build-number ${{ github.run_number }}
      - uses: actions/upload-artifact@v7
        with:
          name: appbundle
          path: nlc_toolkit/build/app/outputs/bundle/release/app-release.aab
      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"
      - name: Install dependencies
        run: bundle install
        working-directory: "./nlc_toolkit/"
      - name: Load Secret
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_PLAYSTORE_KEY }}
          filename: "api-key.json"
          working-directory: "./nlc_toolkit"
      - name: Fastlane Publishing on ${{ github.event.inputs.publish_track }}
        if: github.event_name == 'workflow_dispatch' && github.event.inputs.publish_track != ''
        run: fastlane ${{ github.event.inputs.publish_track }}
        working-directory: "./nlc_toolkit/"
      - name: Fastlane Publishing on production
        if: github.event_name != 'workflow_dispatch' || github.event.inputs.publish_track == ''
        run: fastlane production
        working-directory: "./nlc_toolkit/"
  build-macos:
    if: ${{ vars.NLC_PUBLISH_ENABLED == 'true' }}
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.NLC_APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.NLC_APP_STORE_CONNECT_KEY_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Fix permissions
        run: sudo chown -R $USER . && sudo chmod -R a+rwx .
      - name: Enable macOS
        run: flutter config --enable-macos-desktop
      - name: Install tools
        run: brew install automake libtool create-dmg
      - name: Install Codemagic
        run: pip3 install codemagic-cli-tools==0.69.0 --break-system-packages
      - name: Export private key
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_APP_STORE_CONNECT_PRIVATE_KEY }}
          filename: "AuthKey.p8"
          working-directory: "./nlc_toolkit"
      - name: Export certificate
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_APP_STORE_CERTIFICATE }}
          filename: "cert_key"
          working-directory: "./nlc_toolkit"
      - name: Initialize keychain and certificates
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect fetch-signing-files com.nfclinkcard.nlctoolkit --platform MAC_OS --type MAC_APP_STORE --certificate-key=@file:cert_key --create
          app-store-connect certificates list --type MAC_INSTALLER_DISTRIBUTION --certificate-key=@file:cert_key --save 2>&1 | grep -q 'Did not find' && app-store-connect certificates create --type MAC_INSTALLER_DISTRIBUTION --certificate-key=@file:cert_key --save
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build app
        working-directory: "./nlc_toolkit"
        run: |
          sudo chown -R $USER . && sudo chmod -R a+rwx .
          flutter build macos --release --build-number ${{ github.run_number }} --build-name "1.3.${{ github.run_number }}"
          sudo chown -R $USER . && sudo chmod -R a+rwx .
      - name: Sign package
        working-directory: "./nlc_toolkit"
        run: |
          APP_NAME=$(find $(pwd) -name "*.app")
          PACKAGE_NAME=$(basename "$APP_NAME" .app).pkg
          echo "PACKAGE_NAME=$PACKAGE_NAME" >> $GITHUB_ENV
          xcrun productbuild --component "$APP_NAME" /Applications/ unsigned.pkg
          INSTALLER_CERT_NAME=$(keychain list-certificates \
                    | jq '[.[]
                      | select(.common_name
                      | contains("Mac Developer Installer"))
                      | .common_name][0]' \
                    | xargs)
          xcrun productsign --sign "$INSTALLER_CERT_NAME" unsigned.pkg "$PACKAGE_NAME"
          sudo chown -R $USER . && sudo chmod -R a+rwx .
      - name: Upload package to App Store
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect publish --path "$PACKAGE_NAME"
      - name: Wait for processed macOS build
        timeout-minutes: 30
        working-directory: "./nlc_toolkit"
        shell: bash
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat AuthKey.p8)"
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.nfclinkcard.nlctoolkit --strict-match-identifier --json \
            | jq -er 'if length == 1 then .[0].id else error("Expected exactly one matching app") end')
          BUILD_ID=""
          while [[ -z "$BUILD_ID" ]]; do
              BUILD_ID=$(app-store-connect builds list --app-id "$APP_ID" --platform MAC_OS \
                --build-version-number ${{ github.run_number }} --processing-state VALID --json \
                | jq -r 'if length > 1 then error("Expected at most one matching build") else .[0].id // empty end')
              if [[ -z "$BUILD_ID" ]]; then
                  echo "macOS build is not ready, retrying in 30 seconds..."
                  sleep 30
              fi
          done
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
      - name: Submit to App Store
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-app-store --cancel-previous-submissions --platform=MAC_OS --version-string="1.3.${{ github.run_number }}" --whats-new="Compiled from `git log --pretty=format:%s --oneline --ancestry-path HEAD~1..HEAD`" --version-string="1.3.${{ github.run_number }}" $BUILD_ID
      - name: Submit to TestFlight
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-testflight $BUILD_ID || true
          app-store-connect beta-groups add-build $BUILD_ID --beta-group="Open beta testing" || true
  build-ios:
    if: ${{ vars.NLC_PUBLISH_ENABLED == 'true' }}
    runs-on: macos-latest
    env:
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.NLC_APP_STORE_CONNECT_ISSUER_ID }}
      APP_STORE_CONNECT_KEY_IDENTIFIER: ${{ secrets.NLC_APP_STORE_CONNECT_KEY_IDENTIFIER }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 100
      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest
      - uses: subosito/flutter-action@v2
        with:
          channel: "stable"
      - name: Install tools
        run: brew install automake libtool create-dmg
      - name: Install Codemagic
        run: pip3 install codemagic-cli-tools==0.69.0 --break-system-packages
      - name: Export private key
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_APP_STORE_CONNECT_PRIVATE_KEY }}
          filename: "AuthKey.p8"
          working-directory: "./nlc_toolkit"
      - name: Export certificate
        uses: mobiledevops/secret-to-file-action@v1
        with:
          base64-encoded-secret: ${{ secrets.NLC_APP_STORE_CERTIFICATE }}
          filename: "cert_key"
          working-directory: "./nlc_toolkit"
      - name: Initialize keychain and certificates
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect fetch-signing-files $(xcode-project detect-bundle-id) --platform IOS --type IOS_APP_STORE --certificate-key=@file:cert_key --create
          keychain initialize
          keychain add-certificates
          xcode-project use-profiles
      - name: Build app
        working-directory: "./nlc_toolkit"
        run: |
          flutter build ipa --release --export-options-plist=$HOME/export_options.plist --build-number ${{ github.run_number }} --build-name "1.3.${{ github.run_number }}"
      - name: Upload app to App Store
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect publish --path $(find $(pwd) -name "*.ipa")
      - name: Wait for processed iOS build
        timeout-minutes: 30
        working-directory: "./nlc_toolkit"
        shell: bash
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY="$(cat AuthKey.p8)"
          APP_ID=$(app-store-connect apps list --bundle-id-identifier com.nfclinkcard.nlctoolkit --strict-match-identifier --json \
            | jq -er 'if length == 1 then .[0].id else error("Expected exactly one matching app") end')
          BUILD_ID=""
          while [[ -z "$BUILD_ID" ]]; do
              BUILD_ID=$(app-store-connect builds list --app-id "$APP_ID" --platform IOS \
                --build-version-number ${{ github.run_number }} --processing-state VALID --json \
                | jq -r 'if length > 1 then error("Expected at most one matching build") else .[0].id // empty end')
              if [[ -z "$BUILD_ID" ]]; then
                  echo "iOS build is not ready, retrying in 30 seconds..."
                  sleep 30
              fi
          done
          echo "BUILD_ID=$BUILD_ID" >> "$GITHUB_ENV"
      - name: Submit to App Store
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-app-store --cancel-previous-submissions --platform=IOS --version-string="1.3.${{ github.run_number }}" --whats-new="Compiled from `git log --pretty=format:%s --oneline --ancestry-path HEAD~1..HEAD`" --version-string="1.3.${{ github.run_number }}" $BUILD_ID
      - name: Submit to TestFlight
        working-directory: "./nlc_toolkit"
        run: |
          export APP_STORE_CONNECT_PRIVATE_KEY=`cat AuthKey.p8`
          app-store-connect builds submit-to-testflight $BUILD_ID || true
          app-store-connect beta-groups add-build $BUILD_ID --beta-group="Open beta testing" || true
